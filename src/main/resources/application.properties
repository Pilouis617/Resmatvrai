spring.application.name=resmat

# Connexion à MariaDB (valeurs par défaut identiques à compose.yml)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/resmat}
spring.datasource.username=${DB_USER:resmat}
spring.datasource.password=${DB_PASSWORD:Password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Mise à jour automatique de la base en fonction des entités
spring.jpa.hibernate.ddl-auto=update

# Noms de tables et de colonnes identiques aux attributs Java (ex. createdAt, typeMateriel_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Guillemets ajoutés sur les noms de tables et de champs : préserve la casse
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Mettre à true pour afficher les requêtes SQL dans la console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.hbs

server.port=${PORT:8080}
