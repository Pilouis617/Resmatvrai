services:
  mariadb:
    image: mariadb:11
    container_name: resmat-pilouis
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Password}
      MARIADB_DATABASE: resmat
      MARIADB_USER: ${DB_USER:-resmat}
      MARIADB_PASSWORD: ${DB_PASSWORD:-Password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
