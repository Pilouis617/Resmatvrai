spring.application.name=resmat
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/resmat}
spring.datasource.username=${DB_USER:spring_user}
spring.datasource.password=${DB_PASSWORD:spring_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.hbs
server.port=${PORT:8080}
